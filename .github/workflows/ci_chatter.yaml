# .github/workflows/ci_chatter.yaml
name: CI - Chatter Test Suite

on:
  push:
    paths:
      - 'services/chatter_deployed/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/chatter_deployed/**'
  workflow_dispatch:

jobs:
  # ============================================================
  # LINT JOB - Code Quality Checks
  # ============================================================
  lint-chatter:
    name: Lint Chatter (Black + Flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chatter_deployed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra dev
      
      - name: Run Black formatting check
        run: |
          uv run black --check *.py
      
      - name: Run Flake8 linting
        run: |
          uv run flake8 *.py

  # ============================================================
  # UNIT TESTS - Run with Postgres
  # ============================================================
  unit-tests-chatter:
    name: Chatter Unit Tests
    runs-on: ubuntu-latest
    needs: lint-chatter
    defaults:
      run:
        working-directory: services/chatter_deployed
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra dev
      
      - name: Run unit tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        run: |
          uv run pytest tests/ -v --cov=. --cov-fail-under=50 --cov-report=term --cov-report=html
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatter-test-coverage
          path: services/chatter_deployed/htmlcov/

  # ============================================================
  # TEST SUMMARY - Aggregate Results
  # ============================================================
  test-summary-chatter:
    name: Chatter Test Summary
    runs-on: ubuntu-latest
    needs: [lint-chatter, unit-tests-chatter]
    if: always()
    
    steps:
      - name: Display test results summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "              CHATTER TEST SUITE SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  Lint:        ${{ needs.lint-chatter.result }}"
          echo "  Unit Tests:  ${{ needs.unit-tests-chatter.result }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: Check for failures
        run: |
          if [[ "${{ needs.lint-chatter.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-tests-chatter.result }}" == "failure" ]]; then
            echo ""
            echo "CHATTER TEST SUITE FAILED - See job details above"
            echo ""
            exit 1
          fi
          
          echo ""
          echo "ALL CHATTER TESTS PASSED!"
          echo ""
