name: CI - Loader Tests New Folders

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/loader_deployed/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/loader_deployed/**'
  workflow_dispatch:

env:
  GCP_PROJECT: newsjuice-123456
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a

jobs:
  # ============================================================
  # LINT
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install linters
        run: pip install ruff black
      
      - name: Run Black
        run: black --check services/loader_deployed/*.py || true
      
      - name: Run Ruff
        run: ruff check services/loader_deployed/*.py --ignore E501 || true

  # ============================================================
  # UNIT TESTS
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        working-directory: services/loader_deployed
        run: uv sync --all-extras
      
      - name: Run unit tests
        working-directory: services/loader_deployed
        run: uv run pytest tests/unit/ -v --tb=short

  # ============================================================
  # INTEGRATION TESTS
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: newsdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client
      
      - name: Initialize test database
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -d newsdb_test \
            -f services/loader_deployed/tests/setup/init_test_db.sql
      
      - name: Install dependencies
        working-directory: services/loader_deployed
        run: uv sync --all-extras
      
      - name: Run integration tests
        working-directory: services/loader_deployed
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/newsdb_test
          ARTICLES_TABLE_NAME: articles_test
          VECTOR_TABLE_NAME: chunks_vector_test
        run: uv run pytest tests/integration/ -v --tb=short

  # ============================================================
  # SYSTEM TESTS
  # ============================================================
  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Start services
        working-directory: services/loader_deployed
        run: |
          docker compose -f docker-compose.test.yml up -d --build
          sleep 30
      
      - name: Run system tests
        working-directory: services/loader_deployed
        run: |
          docker compose -f docker-compose.test.yml run --rm system-tests
      
      - name: Show logs on failure
        if: failure()
        working-directory: services/loader_deployed
        run: docker compose -f docker-compose.test.yml logs
      
      - name: Cleanup
        if: always()
        working-directory: services/loader_deployed
        run: docker compose -f docker-compose.test.yml down -v

  # ============================================================
  # DEPLOY - After all tests pass
  # ============================================================
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, system-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      # ------------------------------------------------------
      # CHANGE 1: Authenticate to Google Cloud
      # WHY: Pulumi needs GCP credentials to create/update resources
      # ------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      # ------------------------------------------------------
      # CHANGE 2: Set up Cloud SDK (gcloud CLI)
      # WHY: Needed to configure Docker auth and kubectl
      # ------------------------------------------------------
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
      
      # ------------------------------------------------------
      # CHANGE 3: Configure Docker for Artifact Registry
      # WHY: Pulumi builds and pushes Docker images to GCR
      # ------------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      
      # ------------------------------------------------------
      # CHANGE 4: Install Pulumi CLI
      # WHY: Need pulumi command to run deployments
      # ------------------------------------------------------
      - name: Install Pulumi
        uses: pulumi/actions@v5
      
      # ------------------------------------------------------
      # CHANGE 5: Use standard Python setup (not uv)
      # WHY: uv tried to create venv in /home/app which doesn't exist
      #      in GitHub Actions runner. Standard pip works better here.
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      # ------------------------------------------------------
      # CHANGE 6: Install Pulumi dependencies with pip
      # WHY: uv sync failed with "Permission denied: '/home/app'"
      #      because uv looks for project root incorrectly.
      #      pip install directly is simpler and works.
      # ------------------------------------------------------
      - name: Install deployment dependencies
        run: |
          pip install pulumi pulumi-gcp pulumi-docker-build pulumi-kubernetes
      
      # ------------------------------------------------------
      # CHANGE 7: Configure kubectl for GKE
      # WHY: Pulumi needs kubectl configured to deploy K8s resources
      # ------------------------------------------------------
      - name: Configure GKE credentials
        run: |
          gcloud container clusters get-credentials newsjuice-cluster \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.GCP_PROJECT }}
      
      # ------------------------------------------------------
      # CHANGE 8: Login to Pulumi backend (GCS bucket)
      # WHY: Pulumi stores state in GCS, needs to authenticate
      # ------------------------------------------------------
      - name: Pulumi Login to GCS
        run: pulumi login gs://${{ env.GCP_PROJECT }}-pulumi-state-bucket
      
      # ------------------------------------------------------
      # CHANGE 9: Run Pulumi deployment
      # WHY: This actually deploys the infrastructure
      # 
      # CHANGE 9a: Use 'dev' stack instead of 'prod'
      # WHY: You've been using 'dev' stack locally, so state exists there.
      #      Using 'prod' created a new empty stack causing issues.
      #
      # CHANGE 9b: Added PULUMI_CONFIG_PASSPHRASE=""
      # WHY: Prevents Pulumi from asking for passphrase interactively
      # ------------------------------------------------------
      - name: Pulumi Up
        working-directory: services/deployment
        env:
          PULUMI_CONFIG_PASSPHRASE: ""
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT }}
          GOOGLE_CLOUD_REGION: ${{ env.GCP_REGION }}
        run: |
          pulumi stack select dev --create
          pulumi up --yes --skip-preview

  # ============================================================
  # SUMMARY
  # ============================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, system-tests, deploy]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "## Loader CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| System Tests | ${{ needs.system-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY