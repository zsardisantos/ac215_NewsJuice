name: CI - Loader Tests New Folders

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/loader_deployed/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/loader_deployed/**'
  workflow_dispatch:

env:
  GCP_PROJECT: newsjuice-123456
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a

jobs:
  # ============================================================
  # LINT
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install linters
        run: pip install ruff black
      
      - name: Run Black
        run: black --check services/loader_deployed/*.py || true
      
      - name: Run Ruff
        run: ruff check services/loader_deployed/*.py --ignore E501 || true

  # ============================================================
  # UNIT TESTS
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        working-directory: services/loader_deployed
        run: uv sync --all-extras
      
      - name: Run unit tests
        working-directory: services/loader_deployed
        run: uv run pytest tests/unit/ -v --tb=short

  # ============================================================
  # INTEGRATION TESTS
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: newsdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client
      
      - name: Initialize test database
        run: |
          PGPASSWORD=testpassword psql -h localhost -U postgres -d newsdb_test \
            -f services/loader_deployed/tests/setup/init_test_db.sql
      
      - name: Install dependencies
        working-directory: services/loader_deployed
        run: uv sync --all-extras
      
      - name: Run integration tests
        working-directory: services/loader_deployed
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/newsdb_test
          ARTICLES_TABLE_NAME: articles_test
          VECTOR_TABLE_NAME: chunks_vector_test
        run: uv run pytest tests/integration/ -v --tb=short

  # ============================================================
  # SYSTEM TESTS
  # ============================================================
  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Start services
        working-directory: services/loader_deployed
        run: |
          docker compose -f docker-compose.test.yml up -d --build
          sleep 30
      
      - name: Run system tests
        working-directory: services/loader_deployed
        run: |
          docker compose -f docker-compose.test.yml run --rm system-tests
      
      - name: Show logs on failure
        if: failure()
        working-directory: services/loader_deployed
        run: docker compose -f docker-compose.test.yml logs
      
      - name: Cleanup
        if: always()
        working-directory: services/loader_deployed
        run: docker compose -f docker-compose.test.yml down -v

  # ============================================================
  # DEPLOY - After all tests pass
  # ============================================================
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, system-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
      
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      
      - name: Install Pulumi
        uses: pulumi/actions@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install deployment dependencies
        run: |
          pip install pulumi pulumi-gcp pulumi-docker-build pulumi-kubernetes
      
      - name: Configure GKE credentials
        run: |
          gcloud container clusters get-credentials newsjuice-cluster \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.GCP_PROJECT }}
      
      - name: Pulumi Login to GCS
        run: pulumi login gs://${{ env.GCP_PROJECT }}-pulumi-state-bucket
      
      - name: Pulumi Up
        working-directory: services/deployment
        env:
          PULUMI_CONFIG_PASSPHRASE: ""
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT }}
          GOOGLE_CLOUD_REGION: ${{ env.GCP_REGION }}
        run: |
          cat > Pulumi.yaml << 'EOF'
          name: newsjuice-loader
          runtime:
            name: python
            options:
              toolchain: pip
          description: NewsJuice Loader Service with Cloud SQL PostgreSQL
          EOF
          
          # Create symlinks to match absolute paths in __main__.py
          sudo ln -sf $GITHUB_WORKSPACE/services/loader_deployed /loader_deployed
          sudo ln -sf $GITHUB_WORKSPACE/services/scraper_deployed /scraper_deployed
          sudo ln -sf $GITHUB_WORKSPACE/services/chatter_deployed /chatter_deployed
          sudo ln -sf $GITHUB_WORKSPACE/services/frontend/podcast-app /frontend
          
          pulumi stack select dev
          pulumi cancel --yes || true
          pulumi refresh --yes || true
          pulumi up --yes --skip-preview

  # ============================================================
  # SUMMARY
  # ============================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, system-tests, deploy]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "## Loader CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| System Tests | ${{ needs.system-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY