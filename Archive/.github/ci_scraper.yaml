# .github/workflows/ci_scraper.yaml
name: CI - Scraper Test Suite

on:
  push:
    paths:
      - 'services/scraper_deployed/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/scraper_deployed/**'
  workflow_dispatch:

jobs:
  # ============================================================
  # LINT JOB - Code Quality Checks
  # ============================================================
  lint-scraper:
    name: Lint Scraper (Black + Flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scraper_deployed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra dev
      
      - name: Run Black formatting check
        run: |
          uv run black --check *.py
      
      - name: Run Flake8 linting
        run: |
          uv run flake8 *.py

  # ============================================================
  # UNIT TESTS - Fast, No External Dependencies
  # ============================================================
  unit-tests-scraper:
    name: Scraper Unit Tests (Coverage >= 50%)
    runs-on: ubuntu-latest
    needs: lint-scraper
    defaults:
      run:
        working-directory: services/scraper_deployed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra dev
      
      - name: Install Playwright browsers
        run: |
          uv run playwright install chromium
          uv run playwright install-deps chromium
      
      - name: Run unit tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
        run: |
          uv run pytest tests/unit/ -v --cov=. --cov-fail-under=50 --cov-report=term --cov-report=html
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-test-coverage
          path: services/scraper_deployed/htmlcov/

  # ============================================================
  # INTEGRATION TESTS - With Database
  # ============================================================
  integration-tests-scraper:
    name: Scraper Integration Tests (DB)
    runs-on: ubuntu-latest
    needs: lint-scraper
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    defaults:
      run:
        working-directory: services/scraper_deployed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra dev
      
      - name: Initialize test database
        env:
          PGPASSWORD: test_pass
        run: |
          psql -h localhost -U test_user -d test_db -f tests/setup/init_test_db.sql

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        run: |
          uv run pytest tests/integration/ -v --no-cov

  # ============================================================
  # SYSTEM TESTS - Integration with DB & Container
  # ============================================================
  system-tests-scraper:
    name: Scraper System Tests
    runs-on: ubuntu-latest
    needs: [unit-tests-scraper, integration-tests-scraper]
    defaults:
      run:
        working-directory: services/scraper_deployed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Run System Tests via Docker Compose
        run: |
          docker compose -f docker-compose.test.yml up --build --exit-code-from system-tests

  # ============================================================
  # TEST SUMMARY - Aggregate Results
  # ============================================================
  test-summary-scraper:
    name: Scraper Test Summary
    runs-on: ubuntu-latest
    needs: [lint-scraper, unit-tests-scraper, integration-tests-scraper, system-tests-scraper]
    if: always()
    
    steps:
      - name: Display test results summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "              SCRAPER TEST SUITE SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  Lint:          ${{ needs.lint-scraper.result }}"
          echo "  Unit Tests:    ${{ needs.unit-tests-scraper.result }}"
          echo "  Integration:   ${{ needs.integration-tests-scraper.result }}"
          echo "  System Tests:  ${{ needs.system-tests-scraper.result }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: Check for failures
        run: |
          if [[ "${{ needs.lint-scraper.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-tests-scraper.result }}" == "failure" ]] || \
             [[ "${{ needs.integration-tests-scraper.result }}" == "failure" ]] || \
             [[ "${{ needs.system-tests-scraper.result }}" == "failure" ]]; then
            echo ""
            echo "SCRAPER TEST SUITE FAILED - See job details above"
            echo ""
            exit 1
          fi
          
          echo ""
          echo "ALL SCRAPER TESTS PASSED!"
          echo ""
