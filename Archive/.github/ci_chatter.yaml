# .github/workflows/ci_chatter.yaml
name: CI - Chatter Test Suite

on:
  push:
    paths:
      - 'services/chatter_deployed/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/chatter_deployed/**'
  workflow_dispatch:

jobs:
  # ============================================================
  # LINT JOB - Code Quality Checks
  # ============================================================
  lint-chatter:
    name: Lint Chatter (Black + Flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chatter_deployed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra dev
      
      - name: Run Black formatting check
        run: |
          uv run black --check *.py
      
      - name: Run Flake8 linting
        run: |
          uv run flake8 *.py

  # ============================================================
  # UNIT TESTS - Run with Postgres (Mocked internal, real DB for logic)
  # ============================================================
  unit-tests-chatter:
    name: Chatter Unit Tests
    runs-on: ubuntu-latest
    needs: lint-chatter
    defaults:
      run:
        working-directory: services/chatter_deployed
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra dev
      
      - name: Run unit tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        run: |
          uv run pytest tests/unit/ -v --cov=. --cov-fail-under=50 --cov-report=term --cov-report=html
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatter-test-coverage
          path: services/chatter_deployed/htmlcov/

  # ============================================================
  # INTEGRATION TESTS - Real DB Logic
  # ============================================================
  integration-tests-chatter:
    name: Chatter Integration Tests (DB)
    runs-on: ubuntu-latest
    needs: lint-chatter
    defaults:
      run:
        working-directory: services/chatter_deployed
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra dev
      
      - name: Initialize test database
        env:
          PGPASSWORD: test_pass
        run: |
          psql -h localhost -U test_user -d test_db -f tests/setup/init_test_db.sql
      
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        run: |
          uv run pytest tests/integration/ -v --no-cov

  # ============================================================
  # SYSTEM TESTS - Full Stack with Docker
  # ============================================================
  system-tests-chatter:
    name: Chatter System Tests
    runs-on: ubuntu-latest
    needs: [unit-tests-chatter, integration-tests-chatter]
    defaults:
      run:
        working-directory: services/chatter_deployed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Run System Tests via Docker Compose
        run: |
          docker compose -f docker-compose.test.yml up --build --exit-code-from system-tests

  # ============================================================
  # TEST SUMMARY - Aggregate Results
  # ============================================================
  test-summary-chatter:
    name: Chatter Test Summary
    runs-on: ubuntu-latest
    needs: [lint-chatter, unit-tests-chatter, integration-tests-chatter, system-tests-chatter]
    if: always()
    
    steps:
      - name: Display test results summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "              CHATTER TEST SUITE SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  Lint:          ${{ needs.lint-chatter.result }}"
          echo "  Unit Tests:    ${{ needs.unit-tests-chatter.result }}"
          echo "  Integration:   ${{ needs.integration-tests-chatter.result }}"
          echo "  System Tests:  ${{ needs.system-tests-chatter.result }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: Check for failures
        run: |
          if [[ "${{ needs.lint-chatter.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-tests-chatter.result }}" == "failure" ]] || \
             [[ "${{ needs.integration-tests-chatter.result }}" == "failure" ]] || \
             [[ "${{ needs.system-tests-chatter.result }}" == "failure" ]]; then
            echo ""
            echo "CHATTER TEST SUITE FAILED - See job details above"
            echo ""
            exit 1
          fi
          
          echo ""
          echo "ALL CHATTER TESTS PASSED!"
          echo ""
