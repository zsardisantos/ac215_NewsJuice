services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: newsdb_test
    ports:
      - "5432:5432"
    volumes:
      - ./tests/setup/init_test_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Database connection to local test postgres
      DATABASE_URL: postgresql://postgres:testpassword@postgres:5432/newsdb_test
      DB_URL: postgresql://postgres:testpassword@postgres:5432/newsdb_test

      # Mock or Test Credentials
      GOOGLE_CLOUD_PROJECT: test-project
      GOOGLE_CLOUD_REGION: us-central1
      OPENAI_API_KEY: test-key
      PORT: 8080

      # Since we are running in a container, we might need to handle credentials if the scraper code REQUIRES them file-based.
      # The main dockerfile mounts secrets. Here we might need to mount dummy secrets or ensure code handles missing ones.
      # For now, we assume the code can start up without them if we don't hit endpoints using them immediately, 
      # or we provide dummy files.
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/sa-key.json
      GEMINI_SERVICE_ACCOUNT_PATH: /app/secrets/gemini-service-account.json

    volumes:
      # Mount dummy secrets to prevent file-not-found errors during startup if code checks existence
      - ./tests/setup/init_test_db.sql:/app/secrets/sa-key.json
      - ./tests/setup/init_test_db.sql:/app/secrets/gemini-service-account.json
      # (Reusing a file that exists just to pass 'os.path.exists' checks if any. 
      # Real auth will fail, but health checks should pass).

    depends_on:
      postgres:
        condition: service_healthy

  system-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      SCRAPER_URL: http://scraper:8080
      DATABASE_URL: postgresql://postgres:testpassword@postgres:5432/newsdb_test
    depends_on:
      scraper:
        condition: service_started
      postgres:
        condition: service_healthy
    command: uv run pytest tests/system/ -v
