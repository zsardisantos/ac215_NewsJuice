[project]
name = "newsjuice-loader"
version = "0.1.0"
description = "NewsJuice Loader Service - Article chunking and embedding"
requires-python = ">=3.12"

dependencies = [
  # Web/API
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.27.0",
  "httpx>=0.27.0",
  
  # Database
  "psycopg[binary]>=3.2.1",
  "pgvector>=0.4.1",
  
  # Data processing
  "pandas>=2.3.3",
  "numpy>=2.1.0",
  
  # Text processing & chunking
  "langchain>=0.3.27",
  "langchain-text-splitters>=0.0.1",
  
  # Google Cloud / AI
  "google-genai>=1.43.0",
  "google-cloud-storage>=3.4.1",
  
  # Utilities
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
  # Testing
  "pytest>=7.4.4",
  "pytest-asyncio>=0.23.3",
  "pytest-cov>=4.1.0",
  
  # Linting & formatting
  "black>=24.1.1",
  "flake8>=7.0.0",
  
  # Pre-commit
  "pre-commit>=3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]