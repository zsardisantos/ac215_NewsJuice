services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    volumes:
      - ./tests/setup/init_test_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test_user -d test_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  chatter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://test_user:test_pass@postgres:5432/test_db
      PORT: 8080
      GOOGLE_CLOUD_PROJECT: test-project
      # Prevent crash on start if standard logic checks for file existence
      # We rely on main.py handling missing creds gracefully
      GOOGLE_APPLICATION_CREDENTIALS: /app/dummy_creds.json
      GEMINI_SERVICE_ACCOUNT_PATH: /app/dummy_creds.json

    depends_on:
      postgres:
        condition: service_healthy

  system-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      CHATTER_URL: http://chatter:8080
      DATABASE_URL: postgresql://test_user:test_pass@postgres:5432/test_db
    depends_on:
      chatter:
        condition: service_started
      postgres:
        condition: service_healthy
    command: uv run pytest tests/system/ -v
